<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>q2-gglasso summary</title>
    {#
      bokeh JS/CSS is injected by the visualizer via bokeh.resources.INLINE, so
      the version always matches the installed library. This replaced three
      hardcoded cdn.bokeh.org bokeh-2.4.3 <script> tags: a 2.4.3 runtime cannot
      render a bokeh-3 embed, and the failure mode is a blank white page with no
      Python traceback. INLINE rather than CDN keeps the .qzv self-contained,
      which matters because these are routinely opened offline and through
      `qiime tools view`.
    #}
    {{ bokeh_resources|safe }}
    <script type="text/javascript">
        Bokeh.set_log_level("info");
    </script>
  </head>
<body>
{{ plot_div|safe }} {{ plot_script|safe }}
</body>
</html>
